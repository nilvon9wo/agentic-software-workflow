name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  gates:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The same entry point developers and AI workers run: one definition of
      # "the gates passed". It provisions every pinned tool itself - Python,
      # .NET, Markdown, link and workflow linters - so nothing is checked only
      # here, and nothing here differs from a local run.
      - name: Prove every gate still catches its canary violations
        run: bash scripts/gates.sh verify

      - name: Run every gate against the repository
        run: bash scripts/gates.sh run


# Python standards: the counterpart of .editorconfig + the C# analyzers.
# Everything is on, then the few rules that conflict with the formatter or with
# what a command-line gate script legitimately does are switched off - each
# with a reason, exactly as a C# suppression must carry one.
line-length = 120
target-version = "py312"

[lint]
select = ["ALL"]
ignore = [
    "CPY001",  # parity with C#: .editorconfig sets file_header_template = unset
    "COM812",  # conflicts with `ruff format` (the formatter owns trailing commas)
    "D203",    # incompatible with D211; we use no blank line before a class docstring
    "D213",    # incompatible with D212; summary goes on the first docstring line
    "T201",    # these are command-line gates: print() IS their user interface
    "S603",    # gate scripts exist to run fixed, repo-controlled subprocesses
    "S607",    # ...found on PATH (dotnet, python), as CI installs them
]

[lint.pydocstyle]
convention = "google"

[lint.mccabe]
max-complexity = 5

[lint.pylint]
max-nested-blocks = 2
max-branches = 5
max-returns = 3

[format]
line-ending = "lf"
